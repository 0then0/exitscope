name: Linux validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Disposable Linux cgroup namespace
        # Privilege is explicit and confined to a disposable CI container.
        # The host cgroup hierarchy is never bind-mounted into the container.
        run: |
          # Keep the report parent writable by the ordinary host runner too.
          mkdir -p "validation/ci/${{ matrix.arch }}"
          docker run --rm --init --privileged --cgroupns=private \
            --platform ${{ matrix.platform }} \
            -v "$PWD:/work" -w /work \
            rust:1.99.0 sh -c '
              set -eu
              reports=validation/ci/${{ matrix.arch }}
              mkdir -p "$reports"
              { cat /etc/os-release; uname -a; rustc --version; } > "$reports/environment.txt"
              cat "$reports/environment.txt"
              if [ "${{ matrix.arch }}" = arm64 ]; then
                rustup component add rustfmt clippy
                cargo fmt --check
                cargo clippy --locked --all-targets -- -D warnings
              fi
              mkdir /sys/fs/cgroup/exitscope-tests /tmp/exitscope-ro
              mount --bind /sys/fs/cgroup/exitscope-tests /tmp/exitscope-ro
              mount -o remount,bind,ro /tmp/exitscope-ro
              status=0
              EXITSCOPE_CGROUP_PARENT=/sys/fs/cgroup/exitscope-tests \
              EXITSCOPE_READONLY_CGROUP=/tmp/exitscope-ro EXITSCOPE_CHECK_STYLE=0 \
              EXITSCOPE_REPORTS="$reports" sh scripts/linux-checks.sh || status=1
              python3 tests/delegation.py --cgroup-parent /sys/fs/cgroup/exitscope-tests \
                --reports "$reports/delegation" || status=1
              python3 scripts/external.py --cgroup-parent /sys/fs/cgroup/exitscope-tests \
                --reports "$reports/external" || status=1
              exit "$status"
            '
      - name: Minimum Rust version
        if: ${{ always() && matrix.arch == 'arm64' }}
        run: docker run --rm -v "$PWD:/work" -w /work rust:1.85.0 cargo check --locked
      - name: Explicit systemd user-manager setup and delegation validation
        if: ${{ always() && matrix.arch == 'x86_64' }}
        # This is explicit setup on a disposable hosted VM, outside Docker.
        # The engine neither starts a manager nor changes cgroup permissions.
        run: |
          set -eu
          reports="$PWD/validation/ci/x86_64/systemd"
          mkdir -p "$reports"
          test "$(id -u)" -ne 0
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          {
            printf '%s\n' "sudo systemctl start user@$(id -u).service"
            printf '%s\n' "cargo build --locked --target-dir /tmp/exitscope-systemd-target"
            printf '%s\n' "systemd-run --user --pty --collect --property=Delegate=yes bash $PWD/scripts/systemd-checks.sh /tmp/exitscope-systemd-target/debug/exitscope $reports"
          } > "$reports/commands.txt"
          sudo systemctl start "user@$(id -u).service"
          cargo build --locked --target-dir /tmp/exitscope-systemd-target
          # Allocate the terminal required by the README recipe in a CI shell.
          script -q -e -c "systemd-run --user --pty --collect --property=Delegate=yes bash '$PWD/scripts/systemd-checks.sh' '/tmp/exitscope-systemd-target/debug/exitscope' '$reports'" /dev/null
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: all-validation-outcomes-${{ matrix.arch }}
          path: validation/ci/${{ matrix.arch }}/
