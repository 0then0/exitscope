name: Bug report
description: Report an ExitScope correctness, compatibility or documentation problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, follow SECURITY.md instead of posting details here.
        Redact credentials and unrelated process/path information before attaching reports.
  - type: input
    id: version
    attributes:
      label: ExitScope version or commit
      placeholder: v0.1.1 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - ARM64 (aarch64)
        - x86_64
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and delegation
      description: Distribution, kernel, native/emulated execution, host/VM/container, cgroup v2 and delegation setup. Include systemd/Rust versions if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands, sanitized profile and workload. Do not paste a full environment dump.
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the outcome and findings. Distinguish FAIL, UNRESOLVED and INFRASTRUCTURE_ERROR; explain the expected contract.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Optional sanitized JSON report, timings or CI link. Note whether run cgroups and IPC directories were removed.
